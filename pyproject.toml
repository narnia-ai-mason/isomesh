[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "isomesh"
version = "0.1.0"
description = "Fast, robust isosurface extraction from arbitrary implicit functions using adaptive octree and Manifold Dual Contouring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]

[tool.maturin]
python-source = "python"
module-name = "isomesh._isomesh_rs"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "benchmark: marks benchmark tests",
    "torch: marks tests requiring torch",
]

[dependency-groups]
dev = [
    "pillow>=12.2.0",
    "point-cloud-utils>=0.34.0",
    "pymcubes>=0.1.6",
    "pyrender>=0.1.45",
    "pytest>=9.0.3",
    "pytest-benchmark>=5.2.3",
    "scipy>=1.17.1",
    "trimesh>=4.11.5",
]
