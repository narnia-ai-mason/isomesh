[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "isomesh"
version = "0.1.0"
description = "Fast, robust isosurface extraction from arbitrary implicit functions using adaptive octree and Manifold Dual Contouring"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-benchmark>=4.0",
    "scipy>=1.10",
    "trimesh>=4.0",
]

[tool.maturin]
python-source = "python"
module-name = "isomesh._isomesh_rs"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: marks tests as slow",
    "benchmark: marks benchmark tests",
    "torch: marks tests requiring torch",
]

[dependency-groups]
dev = [
    "pymcubes>=0.1.6",
]
