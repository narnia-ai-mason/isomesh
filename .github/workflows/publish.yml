name: Publish to PyPI

on:
  push:
    branches: [main]
    tags: ['v*']

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.os }}, ${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64
          - os: ubuntu-latest
            target: aarch64
          - os: macos-latest
            target: aarch64
          - os: windows-latest
            target: x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.11
            3.12
            3.13

      - name: Set version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            BASE=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
            VERSION="${BASE}.dev${{ github.run_number }}"
          fi
          python3 -c "
          import re
          v = '${VERSION}'
          with open('pyproject.toml') as f: c = f.read()
          c = re.sub(r'^version = \".*\"', f'version = \"{v}\"', c, count=1, flags=re.M)
          with open('pyproject.toml', 'w') as f: f.write(c)
          print(f'Version set to: {v}')
          "

      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --strip --out dist --interpreter 3.11 3.12 3.13
          sccache: 'true'
          manylinux: auto

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*.whl

  build-sdist:
    name: Build sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            BASE=$(grep -m1 '^version' pyproject.toml | cut -d'"' -f2)
            VERSION="${BASE}.dev${{ github.run_number }}"
          fi
          python3 -c "
          import re
          v = '${VERSION}'
          with open('pyproject.toml') as f: c = f.read()
          c = re.sub(r'^version = \".*\"', f'version = \"{v}\"', c, count=1, flags=re.M)
          with open('pyproject.toml', 'w') as f: f.write(c)
          print(f'Version set to: {v}')
          "

      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish-dev:
    name: Publish dev
    if: github.ref == 'refs/heads/main'
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: dev
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1

  publish-release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
